[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  bblanchon/ArduinoJson@^7.2.0
build_flags =
  -D DEVICE_ID=\"ESP32_FARMACIA_01\"
  -D ONE_WIRE_PIN=4
