name: Reporte de falla
description: Registrar una falla de firmware, servidor o alarmas
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: context
    attributes:
      label: Contexto y comportamiento observado
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versión/commit y componente afectado
